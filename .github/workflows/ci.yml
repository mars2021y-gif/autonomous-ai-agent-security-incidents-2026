name: Security Benchmark & Containment CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Privilege Attenuation & Escape Prevention Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Cascade Escalation Defense Benchmark (7/7 Unit Tests)
      run: |
        python -m unittest agent_supervisor_system/benchmark/test_cascade_escalation.py -v

    - name: Run Interactive Security Demonstration
      run: |
        python agent_supervisor_system/runner.py
